<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep obsidian terminal void -->
    <linearGradient id="hk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e1c" />
      <stop offset="50%" stop-color="#03070f" />
      <stop offset="100%" stop-color="#010307" />
    </linearGradient>

    <!-- Neon phosphor terminal rim -->
    <linearGradient id="hk-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Upper aerodynamic orbital wing (Cyber Cyan to Phosphor Green) -->
    <linearGradient id="hk-wing-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Lower orbital wing (Tactical Emerald to Cyber Cyan) -->
    <linearGradient id="hk-wing-bot" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <!-- Planetary horizon glow -->
    <linearGradient id="hk-horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0" />
      <stop offset="25%" stop-color="#00ff9d" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="1.0" />
      <stop offset="75%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Core radiant bloom -->
    <radialGradient id="hk-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00ff9d" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient interior aura -->
    <radialGradient id="hk-aura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#02050b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Canvas with luminescent border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hk-bg)" stroke="url(#hk-rim)" stroke-width="1.8" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#hk-aura)" />

  <!-- Planetary Horizon Curves (bottom) -->
  <path d="M 8 48 Q 32 39 56 48" fill="none" stroke="url(#hk-horizon)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M 12 51 Q 32 44 52 51" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- Soft Vector Glow Backing for Star -->
  <circle cx="32" cy="32" r="14" fill="url(#hk-bloom)" opacity="0.65" />

  <!-- The Vantage Eye Structure (Aesthetic Cyber Aperture) -->
  <path d="M 10 31.5 C 19 16, 45 16, 54 31.5 C 44 20.5, 20 20.5, 10 31.5 Z" fill="url(#hk-wing-top)" />
  <path d="M 10 32.5 C 19 45, 45 45, 54 32.5 C 44 39.5, 20 39.5, 10 32.5 Z" fill="url(#hk-wing-bot)" opacity="0.95" />

  <!-- Center Radiant Core: 4-Point Signal Star Nexus -->
  <circle cx="32" cy="32" r="7.5" fill="url(#hk-bloom)" />

  <!-- Outer Star Flare (Phosphor Green) -->
  <path d="M 32 14 L 35 32 L 32 50 L 29 32 Z" fill="#00ff9d" opacity="0.8" />
  <path d="M 16 32 L 32 35 L 48 32 L 32 29 Z" fill="#00ff9d" opacity="0.75" />

  <!-- Inner Star Flare (Brilliant Specular White) -->
  <path d="M 32 17 L 33.8 32 L 32 47 L 30.2 32 Z" fill="#ffffff" opacity="0.98" />
  <path d="M 19 32 L 32 33.8 L 45 32 L 32 30.2 Z" fill="#ffffff" opacity="0.95" />

  <!-- Hot Specular White Nexus Core -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
