# Included by nginx.conf in every context that sets its own headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# MapLibre renders with blob: web workers; basemap tiles/glyphs come from CARTO.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.cartocdn.com; frame-ancestors 'none'; base-uri 'self'" always;
