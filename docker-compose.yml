version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: overlook-postgis
    environment:
      POSTGRES_DB: overlook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/seeds/001_seed_sources_and_layers.sql:/docker-entrypoint-initdb.d/002_seed_sources.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overlook"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: overlook-backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgis:5432/overlook
      - ENABLE_BACKGROUND_SYNC=true
      - DEFAULT_SYNC_INTERVAL_SECONDS=300
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: overlook-frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:

